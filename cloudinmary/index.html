<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Cloudinary </title>
    <link rel="stylesheet" href="cloudinmary/styles.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Practica Gestor de Multimedia</h1>
            <p>Aplicaciones Web Orientadas a Servicios</p>
        </header>

        <section class="upload-section">
            <div class="input-group">
                <input type="file" id="inputfile" accept="image/*">
            </div>
            <button id="btnSubir">Cargar Imagen</button>
        </section>

        <section id="ver">
            <p id="textoSubir"></p>
            
            <div id="spinner" class="loader" style="display: none;"></div>
            
            <button id="btnReiniciar" style="display: none;">
                Subir otra imagen
            </button>

            <div class="image-container">
                <img id="imagen" src="" alt="">
            </div>
        </section>
    </main>
    <script src="cloudinmary/main.js"></script>
</body>
</html>
