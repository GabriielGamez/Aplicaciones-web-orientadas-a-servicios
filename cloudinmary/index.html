<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Cloudinary </title>
    <link rel="stylesheet" href="/cloudinmary/styles.css">
</head>

<body>
    <div class="container">
        <h1>Practica de subida de Archivos a Cloudinary</h1>
        <p>Selecciona una imagen para aplicar transformaciones automáticas.</p>

        <div class="upload-section">
            <input type="file" id="inputfile" accept="image/*">
            <button id="btnSubir">Subir Imagen</button>
        </div>

        <div id="ver">
            <p id="textoSubir"></p>
            <div id="spinner" class="loader" style="display: none;"></div>

            <button id="btnReiniciar" style="display: none; background-color: #10b981; margin-top: 10px;">
                Subir otra imagen
            </button>

            <div class="image-container">
                <img id="imagen" src="" alt="">
            </div>
        </div>
    </div>

    <script src="/cloudinmary/main.js"></script>
</body>

</html>
